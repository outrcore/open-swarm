<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Open Swarm</title>
<style>
  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --surface-2: #f5f5f7;
    --border: #e5e5ea;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --blue: #0071e3;
    --blue-soft: rgba(0, 113, 227, 0.10);
    --green: #248a3d;
    --green-soft: rgba(36, 138, 61, 0.10);
    --amber: #b25000;
    --amber-soft: rgba(178, 80, 0, 0.10);
    --red: #d93829;
    --red-soft: rgba(217, 56, 41, 0.10);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.06);
    --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.14);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #111214;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --border: #38383a;
    --ink: #f5f5f7;
    --muted: #98989d;
    --blue: #0a84ff;
    --blue-soft: rgba(10, 132, 255, 0.16);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, 0.16);
    --amber: #ff9f0a;
    --amber-soft: rgba(255, 159, 10, 0.16);
    --red: #ff453a;
    --red-soft: rgba(255, 69, 58, 0.16);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.35);
    --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  button:hover { background: var(--surface-2); }
  button:active { transform: scale(0.985); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary {
    background: var(--blue); border-color: var(--blue); color: #ffffff; font-weight: 600;
  }
  button.primary:hover { filter: brightness(0.95); background: var(--blue); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.ghost:hover { background: var(--surface-2); color: var(--ink); }
  button.danger-txt { color: var(--red); }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 40; height: 50px;
    display: flex; align-items: center; gap: 10px; padding: 0 22px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 650; font-size: 14.5px; letter-spacing: -0.02em; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    font-size: 12px; color: var(--ink); max-width: 240px;
  }
  .pill-btn span.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--green); }
  .dot.err { background: var(--red); }
  .dot.live { background: var(--blue); animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .spacer { flex: 1; }

  /* Toast Banner */
  .toast {
    max-width: 780px; margin: 12px auto 0; padding: 9px 14px; border-radius: 12px;
    font-size: 12.5px; font-weight: 500; display: none; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .toast.show { display: flex; }
  .toast.ok { border-color: rgba(36, 138, 61, 0.35); color: var(--green); }
  .toast.err { border-color: rgba(217, 56, 41, 0.35); color: var(--red); }

  /* Canvas */
  .canvas { max-width: 820px; margin: 0 auto; padding: 42px 20px 64px; }
  .hero-title {
    text-align: center; font-size: 28px; font-weight: 650; letter-spacing: -0.03em;
    margin: 0 0 20px; color: var(--ink);
  }
  .composer {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow-md); padding: 14px 16px 12px;
  }
  .composer textarea {
    width: 100%; border: none; outline: none; resize: none; background: transparent;
    font-size: 15px; line-height: 1.5; min-height: 70px; max-height: 220px; padding: 2px 4px;
  }
  .composer-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border);
  }
  .seg {
    display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 999px; gap: 2px;
  }
  .seg button {
    border: none; background: transparent; color: var(--muted); padding: 4px 12px;
    font-size: 12px; font-weight: 500; border-radius: 999px;
  }
  .seg button.active {
    background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); font-weight: 600;
  }
  .quick-row {
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    margin-top: 14px;
  }
  .quick-chip {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
  }
  .quick-chip:hover { color: var(--ink); background: var(--surface); }

  /* Optional Advanced Ticket Drawer */
  .adv-box {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px; box-shadow: var(--shadow-sm); display: none;
  }
  .adv-box.show { display: block; }
  .ticket-row {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px;
    background: var(--surface-2);
  }
  .ticket-row input, .ticket-row select, .ticket-row textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; outline: none;
  }

  /* Run Topology */
  .stage { margin-top: 28px; }
  .hub-card {
    max-width: 480px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 11px 16px; box-shadow: var(--shadow-sm);
    display: flex; align-items: center; gap: 10px;
  }
  .hub-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hub-sub { font-size: 11.5px; color: var(--muted); }
  .wires { display: block; width: 100%; height: 32px; overflow: visible; }
  .wire-flow { stroke-dasharray: 5 5; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .nodes-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;
  }
  .node-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px;
  }
  .node-card.active { border-color: rgba(0, 113, 227, 0.45); }
  .node-card.passed { border-color: rgba(36, 138, 61, 0.35); }
  .node-card.failed { border-color: rgba(217, 56, 41, 0.35); }
  .node-top { display: flex; align-items: center; gap: 7px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
  }
  .badge.ok { background: var(--green-soft); color: var(--green); }
  .badge.fail { background: var(--red-soft); color: var(--red); }
  .badge.live { background: var(--blue-soft); color: var(--blue); }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .node-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-snip { font-size: 12px; color: var(--muted); min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .winner-banner {
    margin-top: 14px; background: var(--surface); border: 1px solid rgba(36, 138, 61, 0.35);
    border-radius: 14px; padding: 12px 15px; box-shadow: var(--shadow-sm);
  }
  .action-bar {
    margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }

  /* Collapsible Details */
  .details-wrap { margin-top: 16px; display: none; }
  .details-wrap.show { display: block; }
  .detail-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 13px 15px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
  }
  pre.code-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0 0;
  }
  .diff-add { color: var(--green); }
  .diff-del { color: var(--red); }
  .diff-hunk { color: var(--blue); }

  /* Ask Chat Thread */
  .chat-stage { margin-top: 22px; display: none; flex-direction: column; gap: 10px; }
  .chat-stage.show { display: flex; }
  .chat-msg {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 15px; box-shadow: var(--shadow-sm);
  }
  .chat-msg.user { background: var(--surface-2); align-self: flex-end; max-width: 82%; }
  .chat-meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 4px; }
  .chat-body { white-space: pre-wrap; line-height: 1.55; }
  details.think {
    background: var(--surface-2); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px;
  }
  details.think summary { cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 500; }
  .think-body { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; margin-top: 6px; max-height: 220px; overflow-y: auto; }

  /* Popovers & Drawers */
  .popover {
    position: fixed; top: 56px; right: 20px; z-index: 60; width: 340px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-pop); padding: 14px; display: none;
  }
  .popover.left { right: auto; left: 20px; width: 290px; }
  .popover.show { display: block; }
  .pop-field { margin-bottom: 9px; }
  .pop-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  .pop-field input, .pop-field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 9px; font-size: 12px; outline: none;
  }

  .drawer {
    position: fixed; top: 50px; right: 0; bottom: 0; width: 320px; z-index: 55;
    background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-pop);
    padding: 14px; overflow-y: auto; display: none;
  }
  .drawer.show { display: block; }
  .hist-item {
    border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px;
    margin-bottom: 8px; cursor: pointer; background: var(--bg);
  }
  .hist-item.active { border-color: var(--blue); background: var(--blue-soft); }

  /* Preview Modal */
  .modal-bg {
    position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.35);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-bg.show { display: flex; }
  .modal-win {
    width: 100%; max-width: 1080px; height: 82vh; background: var(--surface);
    border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  iframe.preview-frame { flex: 1; width: 100%; border: none; background: var(--bg); }
</style>
</head>
<body>
  <header class="header">
    <div class="brand">Open Swarm</div>
    <button class="pill-btn" onclick="togglePop('repoPop', event)">
      <span class="trunc" id="repoNamePill">Select repository…</span>
      <span style="color:var(--muted);">▾</span>
    </button>
    <div class="spacer"></div>
    <button class="pill-btn" onclick="togglePop('settingsPop', event)">
      <span class="dot" id="gpuDot"></span>
      <span class="trunc" id="gpuLabel">Connecting…</span>
    </button>
    <button class="ghost" onclick="toggleDrawer()">History</button>
  </header>

  <div id="toast" class="toast">
    <span id="toastMsg"></span>
    <button class="ghost" style="padding:2px 8px;" onclick="hideToast()">Dismiss</button>
  </div>

  <main class="canvas">
    <h1 class="hero-title" id="heroTitle">What should the swarm build?</h1>

    <section class="composer">
      <textarea id="goalInput" placeholder="Describe what you want built, fixed, or tested… (⌘↩ to run)"></textarea>
      <div class="composer-bar">
        <div class="seg">
          <button id="segSwarm" class="active" onclick="setMode('swarm')">Swarm</button>
          <button id="segTournament" onclick="setMode('tournament')">Tournament</button>
          <button id="segAsk" onclick="setMode('ask')">Ask</button>
        </div>
        <div class="spacer"></div>
        <button class="ghost danger-txt" id="stopAskBtn" onclick="stopAsk()" style="display:none;">Stop</button>
        <button class="primary" id="runBtn" onclick="handlePrimaryAction()">Run</button>
      </div>
    </section>

    <div class="quick-row">
      <button class="quick-chip" onclick="loadSelfBuildSwarm()">Self-Build Open Swarm</button>
      <button class="quick-chip" onclick="useSandboxRepo()">2-Agent Demo</button>
      <button class="quick-chip" onclick="toggleAdvanced()">Advanced Tickets</button>
    </div>

    <div class="adv-box" id="advBox">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <b style="font-size:12.5px;">Explicit Agent Tickets (Overrides Auto-Planner)</b>
        <div style="display:flex;gap:6px;">
          <button onclick="addTicket()">+ Add</button>
          <button class="ghost" onclick="clearTickets()">Use Goal Only</button>
        </div>
      </div>
      <div id="ticketsList"></div>
    </div>

    <section id="runStage" class="stage" style="display:none;"></section>
    <section id="chatStage" class="chat-stage"></section>
  </main>

  <!-- Repo Popover -->
  <div id="repoPop" class="popover left">
    <div class="pop-field">
      <label>Workspace Repository Path</label>
      <input id="repoPath" onchange="updateRepoUI();savePrefs();" placeholder="/path/to/git/repo" />
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <button onclick="pickFolder();closePops();">Choose Folder…</button>
      <button onclick="loadSelfBuildSwarm();closePops();">Use Isolated Self-Build Copy</button>
      <button onclick="useSandboxRepo();closePops();">Create 2-Agent Sample Repo</button>
    </div>
  </div>

  <!-- Settings Popover -->
  <div id="settingsPop" class="popover">
    <div class="pop-field">
      <label>Backend Preset</label>
      <select id="presetSelect"></select>
    </div>
    <div class="pop-field">
      <label>Endpoint URL (/v1)</label>
      <input id="backendUrl" onchange="savePrefs()" />
    </div>
    <div class="pop-field">
      <label>Model</label>
      <input id="modelName" onchange="savePrefs()" />
    </div>
    <div class="pop-field">
      <label>API Key (Optional)</label>
      <input id="apiKey" type="password" placeholder="outrcore-swarm" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="pop-field">
        <label>Spend Cap ($)</label>
        <input id="spendCap" type="number" step="0.1" value="0.50" onchange="savePrefs()" />
      </div>
      <div class="pop-field">
        <label>Self-Heal Turns</label>
        <input id="repairTurns" type="number" min="0" max="4" value="2" onchange="savePrefs()" />
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input id="autoReview" type="checkbox" checked onchange="savePrefs()" /> Auto Critic Review
      </label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input id="darkToggle" type="checkbox" onchange="toggleTheme(this.checked)" /> Dark Mode
      </label>
    </div>
    <div style="display:flex;gap:6px;">
      <button style="flex:1;" onclick="probeGpu()">Test Connection</button>
      <button style="flex:1;" onclick="openPreview();closePops();">Live Preview</button>
    </div>
  </div>

  <!-- History Drawer -->
  <aside id="historyDrawer" class="drawer">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <b style="font-size:13px;">Recent Runs</b>
      <button class="ghost" style="padding:2px 8px;" onclick="toggleDrawer(false)">Close</button>
    </div>
    <div id="runsList" style="color:var(--muted);font-size:12px;">No runs yet.</div>
  </aside>

  <!-- Preview Modal -->
  <div id="previewModal" class="modal-bg" onclick="if(event.target===this)closePreview()">
    <div class="modal-win">
      <div class="modal-bar">
        <b style="font-size:13px;">Isolated Preview</b>
        <span class="badge" id="previewStatusBadge">Stopped</span>
        <div class="spacer"></div>
        <button class="primary" onclick="controlPreview('restart')">Hot-Reload</button>
        <button onclick="controlPreview('stop')">Stop</button>
        <button class="ghost" onclick="closePreview()">Close</button>
      </div>
      <iframe id="previewFrame" class="preview-frame" src="about:blank"></iframe>
    </div>
  </div>

<script>
const LS_KEY = "open_swarm_apple_v1";
let mode = "swarm";
let tickets = [];
let showAdv = false;
let showDetails = false;
let activeRunId = null;
let pollTimer = null;
let chatHistory = [];
let chatAbort = null;
let selfBuildPath = "";

const STAGE_LABEL = {
  queued: "Queued",
  planning: "Planning",
  worktree: "Setting up",
  thinking: "Thinking",
  coding: "Writing",
  testing: "Testing",
  repairing: "Self-Fixing",
  reviewing: "Reviewing",
  passed: "Verified",
  failed: "Needs Fix"
};

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function showToast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.className = "toast show " + (isErr ? "err" : "ok");
  document.getElementById("toastMsg").textContent = msg;
}
function hideToast() { document.getElementById("toast").className = "toast"; }

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function toggleTheme(dark) {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  savePrefs();
}

function closePops() {
  document.getElementById("repoPop").classList.remove("show");
  document.getElementById("settingsPop").classList.remove("show");
}
function togglePop(id, ev) {
  if (ev) ev.stopPropagation();
  const el = document.getElementById(id);
  const was = el.classList.contains("show");
  closePops();
  if (!was) el.classList.add("show");
}
document.addEventListener("click", ev => {
  if (!ev.target.closest(".popover") && !ev.target.closest(".pill-btn")) closePops();
});

function toggleDrawer(force) {
  const d = document.getElementById("historyDrawer");
  d.classList.toggle("show", force !== undefined ? force : !d.classList.contains("show"));
}

function updateRepoUI() {
  const p = document.getElementById("repoPath").value.trim();
  const name = p.split("/").filter(Boolean).pop() || "Select repository…";
  document.getElementById("repoNamePill").textContent = name;
}

function savePrefs() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      backendUrl: document.getElementById("backendUrl").value,
      modelName: document.getElementById("modelName").value,
      repoPath: document.getElementById("repoPath").value,
      spendCap: document.getElementById("spendCap").value,
      repairTurns: document.getElementById("repairTurns").value,
      autoReview: document.getElementById("autoReview").checked,
      darkMode: document.getElementById("darkToggle").checked,
      mode,
      activeRunId,
      tickets,
      chatHistory: chatHistory.slice(-16)
    }));
  } catch (_) {}
}
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (_) { return null; }
}

function setMode(m) {
  mode = m;
  document.getElementById("segSwarm").classList.toggle("active", m === "swarm");
  document.getElementById("segTournament").classList.toggle("active", m === "tournament");
  document.getElementById("segAsk").classList.toggle("active", m === "ask");
  document.getElementById("runBtn").textContent = m === "ask" ? "Ask" : "Run";
  document.getElementById("goalInput").placeholder = m === "ask"
    ? "Ask your GPU model anything… (⌘↩ to send)"
    : (m === "tournament" ? "Describe one hard task for 3 competing agents + blind judge… (⌘↩)" : "Describe what you want built, fixed, or tested… (⌘↩ to run)");
  document.getElementById("runStage").style.display = m === "ask" ? "none" : (activeRunId ? "block" : "none");
  document.getElementById("chatStage").classList.toggle("show", m === "ask" && chatHistory.length > 0);
  savePrefs();

async function launchRun() {
  hideToast();
  const goalTxt = document.getElementById("goalInput").value.trim();
  const explicitTasks = showAdv && tickets.length ? tickets : [];
  if (!goalTxt && !explicitTasks.length) {
    return showToast("Describe a goal above first.", true);
  }
  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.textContent = "Starting…";
  try {
    const rec = await api("/api/runs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        repo: document.getElementById("repoPath").value,
        backend_url: document.getElementById("backendUrl").value,
        model: document.getElementById("modelName").value,
        api_key: document.getElementById("apiKey").value,
        spend_cap_usd: parseFloat(document.getElementById("spendCap").value || "0.50"),
        max_repair_turns: parseInt(document.getElementById("repairTurns").value || "2", 10),
        auto_review: document.getElementById("autoReview").checked,
        mode,
        goal: explicitTasks.length ? "" : goalTxt,
        tasks: explicitTasks
      })
    });
    activeRunId = rec.run_id;
    savePrefs();
    renderRun(rec);
    await refreshRuns();
    startPolling();
  } catch (err) {
    showToast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Run";
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!activeRunId) return;
    try {
      const rec = await api(`/api/runs/${activeRunId}`);
      renderRun(rec);
      await refreshRuns();
      if (rec.status !== "running") {
        clearInterval(pollTimer);
        pollTimer = null;
        if (rec.status === "completed") {
          showToast(`${rec.passed_count}/${rec.agents_count} verified · $${Number((rec.metering || {}).cost_usd || 0).toFixed(4)}`);
        } else if (rec.error) {
          showToast(rec.error, true);
        }
      }
    } catch (_) {}
  }, 1000);
}

function formatDiff(diff) {
  if (!diff || !diff.trim()) return `<span style="color:var(--muted);">(No changes)</span>`;
  return escapeHtml(diff).split("\n").map(line => {
    if (line.startsWith("+") && !line.startsWith("+++")) return `<span class="diff-add">${line}</span>`;
    if (line.startsWith("-") && !line.startsWith("---")) return `<span class="diff-del">${line}</span>`;
    if (line.startsWith("@@")) return `<span class="diff-hunk">${line}</span>`;
    return line;
  }).join("\n");
}

function renderRun(rec) {
  const stageEl = document.getElementById("runStage");
  if (mode === "ask") return;
  stageEl.style.display = "block";
  const m = rec.metering || {};
  const results = rec.results || [];
  const liveMap = rec.agents_live || {};
  const applied = new Set(rec.applied_agents || []);

  const nodes = results.length
    ? results.map(r => ({
        agent_id: r.agent_id,
        title: r.title || r.ticket || r.agent_id,
        stage: r.stage || (r.tests_ok ? "passed" : "failed"),
        snippet: r.error || (r.written_files && r.written_files.length ? r.written_files.join(", ") : "Done"),
        repair: r.repair_attempts || 0,
        toks: r.completion_tokens || 0,
        tok_s: r.tok_s
      }))
    : Object.values(liveMap).map(l => ({
        agent_id: l.agent_id,
        title: l.title || l.agent_id,
        stage: l.stage || "queued",
        snippet: l.snippet || "Working…",
        repair: 0,
        toks: 0,
        tok_s: null
      }));

  const count = Math.max(1, nodes.length);
  const svg = nodes.length ? (() => {
    const w = 600;
    const paths = nodes.map((n, i) => {
      const x2 = Math.round(((i + 0.5) / count) * w);
      const st = n.stage;
      const active = ["queued", "planning", "worktree", "thinking", "coding", "testing", "repairing", "reviewing"].includes(st);
      const color = st === "passed" ? "#248a3d" : (st === "failed" ? "#d93829" : "#0071e3");
      return `<path d="M 300 0 C 300 18, ${x2} 14, ${x2} 32" fill="none" stroke="${color}" stroke-width="1.6" class="${active && rec.status === 'running' ? 'wire-flow' : ''}" opacity="${active || st === 'passed' ? '0.65' : '0.35'}" />`;
    }).join("");
    return `<svg class="wires" viewBox="0 0 ${w} 32" preserveAspectRatio="none">${paths}</svg>`;
  })() : "";

  const repoName = String(rec.repo || "").split("/").filter(Boolean).pop() || "repo";
  const hubSub = rec.status === "running"
    ? `${repoName} · running`
    : `${repoName} · ${rec.passed_count || 0}/${rec.agents_count || 0} verified${m.aggregate_tok_s != null ? ` · ${m.aggregate_tok_s} tok/s` : ""}${m.cache_hit_pct != null ? ` · ${m.cache_hit_pct}% cached` : ""}`;

  const t = rec.tournament;
  const winnerHtml = (rec.mode === "tournament" && t)
    ? `<div class="winner-banner">
         <div style="display:flex;align-items:center;gap:8px;">
           <span class="badge ok">${t.winner_agent_id ? `Winner: ${escapeHtml(t.winner_agent_id)}` : "No Passing Winner"}</span>
           <span style="font-size:12px;color:var(--muted);">disqualified: ${(t.disqualified || []).length}</span>
         </div>
         ${t.rationale ? `<div style="margin-top:5px;font-size:12.5px;">${escapeHtml(t.rationale)}</div>` : ""}
       </div>`
    : "";

  const unappliedPassed = results.filter(r => r.tests_ok && r.diff && !applied.has(r.agent_id)).length;
  const winnerId = t && t.winner_agent_id;

  stageEl.innerHTML = `
    <div class="hub-card">
      <span class="dot ${rec.status === 'completed' ? 'ok' : (rec.status === 'error' ? 'err' : 'live')}"></span>
      <div style="min-width:0;flex:1;">
        <div class="hub-title">${escapeHtml(rec.goal || rec.run_id)}</div>
        <div class="hub-sub">${escapeHtml(hubSub)}</div>
      </div>
      <span class="badge ${rec.status === 'completed' ? 'ok' : (rec.status === 'error' ? 'fail' : 'live')}">${escapeHtml(rec.status)}</span>
    </div>
    ${svg}
    <div class="nodes-grid">
      ${nodes.map(n => {
        const st = n.stage || "queued";
        const isLive = ["queued", "planning", "worktree", "thinking", "coding", "testing", "repairing", "reviewing"].includes(st);
        const cls = st === "passed" ? "passed" : (st === "failed" ? "failed" : (isLive ? "active" : ""));
        const bCls = st === "passed" ? "ok" : (st === "failed" ? "fail" : (st === "repairing" ? "warn" : "live"));
        return `
          <div class="node-card ${cls}">
            <div class="node-top">
              <span class="dot ${st === 'passed' ? 'ok' : (st === 'failed' ? 'err' : 'live')}"></span>
              <span class="badge ${bCls}">${escapeHtml(STAGE_LABEL[st] || st)}</span>
              ${n.repair > 0 ? `<span class="badge warn">fixed ×${n.repair}</span>` : ""}
              <div class="spacer"></div>
              <span style="font-size:11px;color:var(--muted);">${escapeHtml(n.agent_id)}</span>
            </div>
            <div class="node-title" title="${escapeHtml(n.title)}">${escapeHtml(n.title)}</div>
            <div class="node-snip" title="${escapeHtml(n.snippet)}">${escapeHtml(n.snippet)}</div>
          </div>
        `;
      }).join("")}
    </div>
    ${winnerHtml}
    ${rec.error ? `<div class="detail-card" style="margin-top:12px;border-color:rgba(217,56,41,0.35);color:var(--red);">${escapeHtml(rec.error)}</div>` : ""}
    ${rec.status === "completed" ? `
      <div class="action-bar">
        ${winnerId && !applied.has(winnerId)
          ? `<button class="primary" onclick="applyOne('${rec.run_id}','${winnerId}')">Apply Winner</button>`
          : `<button class="primary" onclick="applyAll('${rec.run_id}')" ${unappliedPassed ? "" : "disabled"}>${unappliedPassed ? `Apply All Verified (${unappliedPassed})` : "All Verified Applied"}</button>`}
        <button onclick="openPreview()">Preview</button>
        <button class="ghost" onclick="showDetails=!showDetails;renderRun(window._lastRun)">Inspect Details ${showDetails ? "▴" : "▾"}</button>
      </div>
    ` : ""}
    <div class="details-wrap ${showDetails ? "show" : ""}">
      ${results.map(a => `
        <div class="detail-card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <b>${escapeHtml(a.agent_id)}</b>
            <span class="badge ${a.tests_ok ? 'ok' : 'fail'}">${a.tests_ok ? 'Verified' : 'Failed'}</span>
            ${a.repair_attempts ? `<span class="badge warn">Self-Healed ×${a.repair_attempts}</span>` : ""}
            ${a.review ? `<span class="badge ${a.review.verdict === 'approve' ? 'ok' : (a.review.verdict === 'block' ? 'fail' : 'warn')}">Critic: ${escapeHtml(a.review.verdict)}</span>` : ""}
            ${a.tok_s != null ? `<span class="badge">${a.completion_tokens || 0} tok · ${a.tok_s} t/s</span>` : ""}
            ${applied.has(a.agent_id) ? `<span class="badge ok">Applied</span>` : ""}
            <div class="spacer"></div>
            <button onclick="reviewOne('${rec.run_id}','${a.agent_id}')" ${!a.diff ? 'disabled' : ''}>Re-Review</button>
            <button class="primary" onclick="applyOne('${rec.run_id}','${a.agent_id}')" ${!a.diff || applied.has(a.agent_id) ? 'disabled' : ''}>Apply Diff</button>
          </div>
          ${a.error ? `<pre class="code-box" style="color:var(--red);">${escapeHtml(a.error)}</pre>` : ""}
          ${a.review && a.review.summary ? `<div style="margin-top:6px;font-size:12px;color:var(--muted);">Critic: ${escapeHtml(a.review.summary)}</div>` : ""}
          ${a.test_output ? `<pre class="code-box">${escapeHtml(a.test_output)}</pre>` : ""}
          ${a.diff ? `<pre class="code-box">${formatDiff(a.diff)}</pre>` : ""}
        </div>
      `).join("")}
    </div>
  `;
  window._lastRun = rec;
}

async function applyAll(runId, force = false) {
  try {
    const out = await api(`/api/runs/${runId}/apply-all`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ force })
    });
    const rec = await api(`/api/runs/${runId}`);
    renderRun(rec);
    showToast(`Applied ${out.applied.length} verified patch(es)${out.skipped.length ? ` (${out.skipped.length} skipped)` : ""}.`);
  } catch (err) {
    showToast(err.message, true);
  }
}

async function applyOne(runId, agentId, force = false) {
  try {
    await api(`/api/runs/${runId}/apply`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ agent_id: agentId, force })
    });
    const rec = await api(`/api/runs/${runId}`);
    renderRun(rec);
    showToast(`Applied ${agentId}'s patch.`);
  } catch (err) {
    if (err.status === 409) {
      const files = ((err.data && err.data.conflicts) || []).map(c => c.path).join(", ");
      if (confirm(`Files changed externally (${files}). Force apply ${agentId}'s patch?`)) {
        return applyOne(runId, agentId, true);
      }
      return;
    }
    showToast(err.message, true);
  }
}

async function reviewOne(runId, agentId) {

/* Ask Streaming Mode */
function stopAsk() { if (chatAbort) chatAbort.abort(); }
async function sendAsk() {
  const inp = document.getElementById("goalInput");
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = "";
  chatHistory.push({ role: "user", content: txt });
  savePrefs();

  const stage = document.getElementById("chatStage");
  stage.classList.add("show");
  const uEl = document.createElement("div");
  uEl.className = "chat-msg user";
  uEl.innerHTML = `<div class="chat-body">${escapeHtml(txt)}</div>`;
  stage.appendChild(uEl);

  const bEl = document.createElement("div");
  bEl.className = "chat-msg";
  bEl.innerHTML = `
    <details class="think" open style="display:none;"><summary>Thinking…</summary><div class="think-body"></div></details>
    <div class="chat-body"></div>
    <div class="chat-meta" style="margin-top:6px;margin-bottom:0;">Streaming…</div>
  `;
  stage.appendChild(bEl);

  const thinkEl = bEl.querySelector(".think");
  const thinkSum = thinkEl.querySelector("summary");
  const thinkBody = thinkEl.querySelector(".think-body");
  const bodyEl = bEl.querySelector(".chat-body");
  const metaEl = bEl.querySelector(".chat-meta");

  const runBtn = document.getElementById("runBtn");
  const stopBtn = document.getElementById("stopAskBtn");
  runBtn.disabled = true;
  stopBtn.style.display = "inline-block";
  chatAbort = new AbortController();

  let fullThink = "", fullContent = "", t0 = null;
  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        backend_url: document.getElementById("backendUrl").value,
        model: document.getElementById("modelName").value,
        api_key: document.getElementById("apiKey").value,
        messages: chatHistory,
        max_tokens: 1024
      }),
      signal: chatAbort.signal
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    const handleFrame = frame => {
      let evName = "message";
      const lines = [];
      for (const ln of frame.split(/\r?\n/)) {
        if (ln.startsWith("event:")) evName = ln.slice(6).trim();
        else if (ln.startsWith("data:")) lines.push(ln.slice(5).trim());
      }
      if (!lines.length) return;
      const d = JSON.parse(lines.join("\n"));
      if (evName === "thinking") {
        if (t0 === null) t0 = performance.now();
        thinkEl.style.display = "block";
        fullThink += d.delta || "";
        thinkBody.textContent = fullThink;
        thinkSum.textContent = `Thinking… (${((performance.now() - t0)/1000).toFixed(1)}s)`;
      } else if (evName === "content") {
        if (fullThink && thinkEl.open) {
          thinkEl.open = false;
          thinkSum.textContent = `Thought for ${t0 ? ((performance.now() - t0)/1000).toFixed(1) : "0.0"}s`;
        }
        fullContent += d.delta || "";
        bodyEl.textContent = fullContent;
      } else if (evName === "stats" || evName === "done") {
        const parts = [];
        if (d.tok_s != null && isFinite(d.tok_s)) parts.push(`${Number(d.tok_s).toFixed(1)} tok/s`);
        if (d.ttft_ms != null) parts.push(`${Number(d.ttft_ms).toFixed(0)}ms TTFT`);
        if (d.completion_tokens != null) parts.push(`${d.completion_tokens} tok`);
        metaEl.textContent = parts.join(" · ");
      } else if (evName === "error") {
        metaEl.textContent = "Error";
        bodyEl.textContent = d.error || "Failed";
      }
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (frame.trim()) handleFrame(frame);
      }
    }
    if (fullContent || fullThink) {
      chatHistory.push({ role: "assistant", content: fullContent || fullThink });
      savePrefs();
    }
  } catch (err) {
    if (err.name !== "AbortError") metaEl.textContent = err.message;
  } finally {
    chatAbort = null;
    runBtn.disabled = false;
    stopBtn.style.display = "none";
  }
}

document.getElementById("goalInput").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    handlePrimaryAction();
  }
});

async function init() {
  const cfg = await api("/api/config");
  selfBuildPath = cfg.self_build_repo || cfg.default_repo || "";
  const sel = document.getElementById("presetSelect");
  sel.innerHTML = cfg.presets.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label)}</option>`).join("");
  const applyPreset = id => {
    const p = cfg.presets.find(x => x.id === id) || cfg.presets[0];
    document.getElementById("backendUrl").value = p.backend_url;
    document.getElementById("modelName").value = p.model;
    savePrefs();
  };
  sel.addEventListener("change", () => { applyPreset(sel.value); probeGpu(); });

  const saved = loadPrefs();
  if (saved) {
    document.getElementById("backendUrl").value = saved.backendUrl || cfg.presets[0].backend_url;
    document.getElementById("modelName").value = saved.modelName || cfg.presets[0].model;
    document.getElementById("repoPath").value = saved.repoPath || cfg.default_repo;
    if (saved.spendCap) document.getElementById("spendCap").value = saved.spendCap;
    if (saved.repairTurns != null) document.getElementById("repairTurns").value = saved.repairTurns;
    if (saved.autoReview != null) document.getElementById("autoReview").checked = saved.autoReview;
    if (saved.darkMode) {
      document.getElementById("darkToggle").checked = true;
      document.documentElement.setAttribute("data-theme", "dark");
    }
    if (Array.isArray(saved.tickets)) tickets = saved.tickets;
    if (saved.mode) setMode(saved.mode);
    if (saved.activeRunId) activeRunId = saved.activeRunId;
  } else {
    applyPreset(cfg.presets[0].id);
    document.getElementById("repoPath").value = cfg.default_repo;
  }
  updateRepoUI();
  renderTickets();
  probeGpu();
  await refreshRuns();
  if (activeRunId && mode !== "ask") {
    try { await selectRun(activeRunId); } catch (_) {}
  }
  document.getElementById("goalInput").focus();
}

init();
</script>
</body>
