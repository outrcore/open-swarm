[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outrcore-open-swarm"
version = "0.1.0"
description = "Apple-clean agent-first parallel coding swarm with git worktree isolation, self-healing tests, and continuity context guards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/outrcore/open-swarm"

[project.scripts]
open-swarm = "desktop_server:main"

[tool.setuptools]
py-modules = [
  "desktop_server",
  "swarm_run",
  "orchestrator",
  "continuity_store",
  "fleet_scanner",
  "metering",
]
