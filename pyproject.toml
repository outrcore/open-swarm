[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outrcore-open-swarm"
version = "0.5.1"
description = "Apple-clean agent-first parallel coding swarm with git worktree isolation, Swarm Message Board, OS sandboxing, Tailscale compute mesh, CLI doctor/bench, and continuity context guards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/outrcore/open-swarm"

[project.scripts]
open-swarm = "open_swarm_cli:main"

[tool.setuptools]
py-modules = [
  "open_swarm_cli",
  "desktop_server",
  "swarm_run",
  "agent_loop",
  "agent_tools",
  "orchestrator",
  "continuity_store",
  "fleet_scanner",
  "metering",
  "research_loop",
  "device_mesh",
  "swarm_node",
]
